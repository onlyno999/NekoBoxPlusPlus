name: Build NekoBoxPlusPlus
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
permissions:
  contents: write
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore -name '*.sh' | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | sort | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore -name '*.sh' | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | sort | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > release.keystore
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.SIGNING_PASS }}
          ALIAS_NAME: personal
          ALIAS_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease app:assembleFdroidRelease
      - name: Gradle Build (play variant)
        continue-on-error: true
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.SIGNING_PASS }}
          ALIAS_NAME: personal
          ALIAS_PASS: ${{ secrets.SIGNING_PASS }}
        run: ./gradlew app:assemblePlayRelease
      - name: Gradle Build (preview variant)
        continue-on-error: true
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.SIGNING_PASS }}
          ALIAS_NAME: personal
          ALIAS_PASS: ${{ secrets.SIGNING_PASS }}
        run: ./gradlew app:assemblePreviewRelease
      - name: Publish APKs to release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: NekoBox++ ${{ inputs.release_tag }}
          files: app/build/outputs/apk/**/*.apk
